import groovy.json.JsonSlurper
import java.security.MessageDigest

plugins {
    id 'java'
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.renamer' version '1.1.5'
    id 'net.minecraftforge.gradle' version '7.0.34'
}

group = 'zone.moddev.mc.baseminerals'
version = '2.5.1.113021'
base.archivesName = 'BaseMinerals'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(8)
    withSourcesJar()
    withJavadocJar()
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addBooleanOption('notimestamp', true)
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def modClasses = layout.buildDirectory.dir('forge-run-mod-classes/main')
def stageRunClasses = tasks.register('stageRunClasses', Sync) {
    from sourceSets.main.output
    into modClasses
}

minecraft {
    mappings channel: 'snapshot', version: '20180921-1.13'
    if (gradle.startParameter.offline) mavenizerArguments.add('--offline')
    runs {
        configureEach {
            mainClass = 'net.minecraftforge.userdev.LaunchTesting'
            workingDir.convention layout.projectDirectory.dir(
                    providers.gradleProperty('baseMineralsRunDirectory').getOrElse('run'))
            mods { baseminerals { source sourceSets.main } }
            environment 'target', name == 'client' ? 'fmluserdevclient' : 'fmluserdevserver'
            environment 'MC_VERSION', '1.13.2'
            environment 'MCP_VERSION', '20190213.203750'
            environment 'MCP_MAPPINGS', 'snapshot_20180921-1.13'
            environment 'FORGE_VERSION', '25.0.223'
            environment 'FORGE_GROUP', 'net.minecraftforge'
            def path = modClasses.get().asFile.absolutePath
            environment 'MOD_CLASSES', "baseminerals%%${path}${File.pathSeparator}baseminerals%%${path}"
        }
        register('client')
        register('server') { args '--nogui' }
    }
}

def mirror = file(providers.gradleProperty('legacyDependencyVerificationRepository')
        .getOrElse('.gradle/legacy-dependencies'))
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    exclusiveContent {
        forRepository {
            maven {
                url = mirror.isDirectory() ? mirror.toURI() : uri('https://www.cursemaven.com')
                metadataSources { artifact() }
            }
        }
        filter { includeGroup 'curse.maven' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'PublishedBaseMetals'
                url = mirror.isDirectory() ? mirror.toURI() : uri('https://maven.moddev.zone/releases')
                metadataSources { artifact() }
            }
        }
        filter { includeModule('zone.moddev.mc.basemetals', 'BaseMetals') }
    }
    mavenCentral()
}

def specs = new JsonSlurper().parse(file('gradle/dependencies.json'))
configurations {
    pinnedMods { canBeConsumed = false; transitive = false }
}
dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:1.13.2-25.0.223')
    specs.each { spec ->
        pinnedMods spec.coordinate
        if (spec.runtime) implementation renamer.dependency(spec.coordinate)
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}
renamer.mappings.from minecraft.dependency.toSrgFile
tasks.named('jar', Jar) {
    archiveClassifier = 'deobf'
    destinationDirectory = layout.buildDirectory.dir('libs-dev')
}
def playerJar = renamer.classes(tasks.named('jar', Jar)) {
    map.from minecraft.dependency.toSrgFile
    archiveClassifier = null
    output = layout.buildDirectory.file("libs/BaseMinerals-${project.version}.jar")
}
tasks.named('assemble') { dependsOn playerJar }
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'BaseMinerals'
            artifact(playerJar)
            artifact(tasks.named('sourcesJar'))
            artifact(tasks.named('javadocJar'))
        }
    }
}

tasks.register('verifyPinnedMods') {
    group = 'verification'
    inputs.files(configurations.pinnedMods)
    doLast {
        def artifacts = configurations.pinnedMods.resolvedConfiguration.resolvedArtifacts
        specs.each { spec ->
            def version = spec.coordinate.split(':')[2]
            def archive = artifacts.find { it.moduleVersion.id.version == version }.file
            def hash = MessageDigest.getInstance('SHA-256').digest(archive.bytes).encodeHex().toString()
            if (!hash.equalsIgnoreCase(spec.sha256)) throw new GradleException("Wrong SHA-256 for ${spec.coordinate}")
        }
    }
}
tasks.named('compileJava') { dependsOn 'verifyPinnedMods' }
tasks.named('test') { useJUnitPlatform() }

tasks.register('verifyFluidRegistration', Exec) {
    group = 'verification'
    description = 'Checks that fluid registration runs before blocks, outside parallel construction.'
    commandLine 'node', '--test', 'tools/test_fluid_registration.js'
}
tasks.named('check') { dependsOn 'verifyFluidRegistration' }
['client', 'server'].each { run ->
    tasks.matching { it.name == 'run' + run.capitalize() }.configureEach {
        dependsOn stageRunClasses
        doFirst {
            File gameDir = minecraft.runs.named(run).get().workingDir.get().asFile
            File mods = new File(gameDir, 'mods')
            if (!mods.isDirectory() && !mods.mkdirs()) throw new GradleException("Could not create ${mods}")
        }
    }
}
tasks.named('eclipse') { dependsOn 'genEclipseRuns', stageRunClasses }

tasks.named('processResources', ProcessResources) {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand(version: project.version) }
}

apply from: 'gradle/ore-models.gradle'

apply from: 'gradle/release-113.gradle'

apply from: 'gradle/normalize-javadoc-trees.gradle'
