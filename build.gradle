plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

def env = System.getenv()
def tag = providers.environmentVariable('TAG')
version = tag.orElse("${mod_version}-development").get()
group = mod_group

base {
    archivesName = mod_archive_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}

sourceSets {
    // In-world game tests, kept out of the published jar.
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
}

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        configureEach {
            gameDirectory = file('run')
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Runs every Base Minerals game test in a fresh world, then exits; check runs it.
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            gameDirectory = layout.buildDirectory.dir('gametest').get().asFile
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }

    // JUnit tests run with the game, MMDLib, OreSpawn and Base Minerals loaded.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'ModDevZone'
        url = uri('https://maven.moddev.zone/releases')
        content {
            includeGroup 'zone.moddev.mc.lib'
            includeGroup 'zone.moddev.mc.orespawn'
        }
    }
}

dependencies {
    implementation "zone.moddev.mc.lib:mmdlib:${mmdlib_version}"
    implementation "zone.moddev.mc.orespawn:OreSpawn:${orespawn_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "net.neoforged:testframework:${neoforge_version}"
}

tasks.named('processResources', ProcessResources) {
    def properties = [
            minecraft_version_range: minecraft_version_range,
            neoforge_version_range: neoforge_version_range,
            loader_version_range: loader_version_range,
            mmdlib_version_range: mmdlib_version_range,
            orespawn_version_range: orespawn_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: project.version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            curseforge_url: "https://www.curseforge.com/minecraft/mc-mods/base-minerals",
            issue_url: issue_url,
            update_url: update_url
    ]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand properties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Fail on deprecated or removal-marked API, so new uses are replaced rather than kept.
    options.compilerArgs += ['-Xlint:deprecation,removal', '-Werror']
}

neoForge.addModdingDependenciesTo(sourceSets.gametest)

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.named('check') {
    dependsOn 'runGameTestServer'
}

tasks.named('jar', Jar) {
    from('LICENSE', 'LICENSE-ART.txt', 'LICENSE-TiC.txt')
}

apply from: 'gradle/ore-models.gradle'

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = mod_archive_name
            from components.java
        }
    }
    repositories {
        if (env.MAVEN_UPLOAD_URL) {
            maven {
                url = uri(env.MAVEN_UPLOAD_URL)
                credentials {
                    username = env.MAVEN_UPLOAD_USERNAME
                    password = env.MAVEN_UPLOAD_PASSWORD
                }
            }
        }
    }
}

idea {
    module {
        downloadSources = true
    }
}

eclipse {
    classpath {
        downloadJavadoc = true
        downloadSources = true
    }
}
